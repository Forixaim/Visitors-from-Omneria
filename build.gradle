buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'signing'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--username', 'Forixaim'
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"

    config "${mod_id}.mixins.optional.json"
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:epic-fight-mod-405076:7316952")
    implementation fg.deobf("curse.maven:epic-fight-skill-tree-1295882:7185770")
    implementation fg.deobf("curse.maven:ex-cap-1074178:7325889")
    implementation fg.deobf("curse.maven:epic-fight-invincible-1184379:7321454")
    compileOnly fg.deobf("curse.maven:shimmer-627824:5685940")
    implementation fg.deobf("libs:battleartsapi:20.14.8.1")
    compileOnly fg.deobf("curse.maven:epic-fight-the-mimic-1360684:7120283")
    implementation fg.deobf("curse.maven:epic-fight-avalon-1268823:7095000")
    compileOnly fg.deobf("curse.maven:official-epic-fight-x-parcool-1259252:6870242")
    compileOnly fg.deobf("curse.maven:iceberg-520110:5138899")
    compileOnly fg.deobf("curse.maven:prism-lib-638111:4650325")
    implementation fg.deobf("curse.maven:combat-evolution-1377795:7290716")
    implementation fg.deobf("curse.maven:lendercataclysm-551586:6906993")
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    implementation fg.deobf("curse.maven:lionfish-api-1001614:5922047")

    compileOnly fg.deobf("curse.maven:legendary-tooltips-532127:4662781")
    compileOnly fg.deobf("curse.maven:placebo-283644:6274231")
    //runtimeOnly fg.deobf("curse.maven:rpg-hud-235670:4805323")
    compileOnly fg.deobf("curse.maven:mekanism-268560:5395221")
    runtimeOnly fg.deobf("curse.maven:skinrestorer-443823:6015917")
    implementation fg.deobf("curse.maven:codechicken-lib-1-8-242818:5753868")
    implementation fg.deobf("curse.maven:draconic-evolution-223565:6793843")
    //compileOnly fg.deobf("libs:nightfall_invade:1.1.1")
    implementation fg.deobf("curse.maven:brandons-core-231382:5422013")
    compileOnly fg.deobf("curse.maven:projecte-226410:4901949")
    runtimeOnly fg.deobf("curse.maven:selene-499980:5546852")
    compileOnly fg.deobf("curse.maven:parcool-482378:6652972")
    implementation fg.deobf("curse.maven:mmmmmmmmmmmm-225738:5319203")
    compileOnly fg.deobf("curse.maven:geckolib-388172:5060416")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
